<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetih Finansal Bot</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="popup-header">
        <div class="logo-area">
            <span class="material-symbols-outlined gold-icon">smart_toy</span>
            <h1>Fetih AI Analiz</h1>
        </div>
        <div id="status-dot" class="status-indicator"></div>
    </header>

    <main>
        <section class="price-section glass-card">
            <div class="card-header">
                <h2>Has Altın (Güncel)</h2>
                <span id="last-update" class="time-label">--:--</span>
            </div>
            <div class="price-display">
                <span id="current-price" class="price-value">--.--</span>
                <span class="currency">TL/Gr</span>
            </div>
        </section>

        <section class="reports-section">
            <h3 class="section-title">Piyasa Raporları</h3>
            <div id="reports-container">
                <div class="loading-state">
                    <span class="material-symbols-outlined spin">sync</span>
                    <p>Veriler analiz ediliyor...</p>
                </div>
            </div>
        </section>
        
        <div id="error-box" class="error-box hidden"></div>
    </main>

    <script src="js/popup.js"></script>
</body>
</html>
